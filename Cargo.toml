[workspace]
resolver = "3"
members = [
    "crates/kasumi-core",
    "crates/kasumi-text",
    "crates/kasumi-state",
    "crates/kasumi-tree",
    "crates/kasumi-layout",
    "crates/kasumi-paint",
    "crates/kasumi",
    "crates/kasumi-backend",
    "demo",
]
default-members = ["demo"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
kasumi-core = { path = "crates/kasumi-core" }
kasumi-text = { path = "crates/kasumi-text" }
kasumi-state = { path = "crates/kasumi-state" }
kasumi-tree = { path = "crates/kasumi-tree" }
kasumi-layout = { path = "crates/kasumi-layout" }
kasumi-paint = { path = "crates/kasumi-paint" }
kasumi = { path = "crates/kasumi" }
kasumi-backend = { path = "crates/kasumi-backend" }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSCell", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "NSButton", "NSControl", "NSResponder", "NSView", "NSApplication", "NSRunningApplication", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSGeometry", "NSObject", "NSData"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

anyhow = "1.0"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
# System tray. `ksni` implements the freedesktop StatusNotifierItem protocol
# over D-Bus, so Linux needs neither GTK nor libappindicator. Windows and macOS
# use platform bindings directly; see `kasumi-backend/src/tray`.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
bytemuck = "1.25"
fontdb = "0.23"
glow = "0.16"
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
material-color-utilities = "1.0.0-dev.18"
pulldown-cmark = "0.13"
pollster = "0.4"
qrcode = { version = "0.13", default-features = false }
resvg = { version = "0.48", default-features = false, features = ["svgz", "text", "system-fonts", "raster-images"] }
swash = "0.2"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "metal", "dx12"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

# Debug builds should still be usable as an interactive demo. Dependencies and
# workspace crates share opt-level 1, which keeps first builds and rebuilds
# cheap while the UI stays responsive; application code still has debug
# assertions, overflow checks and line tables.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
